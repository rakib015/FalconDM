<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      color: #4ade80;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 2px 6px;
      border-radius: 999px;
    }
    /* Tabs */
    .nav-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
      background: #0b1120;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }
    .nav-tab {
      flex: 1;
      padding: 6px 4px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-tab.active {
      color: #ffffff;
      background: #2563eb;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .active-tab-box {
      background: #181a20;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .tab-title {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }
    .btn-main {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-main:hover {
      background: #1d4ed8;
    }
    .input-box {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    input[type="text"] {
      flex: 1;
      background: #181a20;
      border: 1px solid #334155;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    .btn-send {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-send:hover {
      background: #0369a1;
    }
    .status {
      font-size: 11px;
      text-align: center;
      color: #4ade80;
      min-height: 16px;
      font-weight: 600;
      margin-top: 6px;
    }
    /* Sniffer list */
    .sniffer-list {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #1e293b;
      border-radius: 8px;
      background: #0d121d;
      margin-bottom: 10px;
    }
    .sniffer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid #1a2234;
      gap: 6px;
    }
    .sniffer-item:last-child {
      border-bottom: none;
    }
    .sniffer-info {
      flex: 1;
      min-width: 0;
    }
    .sniffer-name {
      font-size: 11px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sniffer-meta {
      font-size: 10px;
      color: #64748b;
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 2px;
    }
    .btn-sniff-dl {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-sniff-dl:hover {
      background: #1d4ed8;
    }
    .empty-sniffer {
      padding: 24px 12px;
      text-align: center;
      color: #64748b;
      font-size: 11px;
    }
    .sniff-filter {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .sniff-filter:hover {
      background: #27354a;
      color: #f1f5f9;
    }
    .sniff-filter.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ FalconDM Grabber</div>
    <div id="statusBadge" class="badge">ONLINE</div>
  </div>

  <div class="nav-tabs">
    <button id="tabBtnQuick" class="nav-tab active">⚡ Quick Action</button>
    <button id="tabBtnSniff" class="nav-tab">🔍 Tab Inspector (<span id="sniffCount">0</span>)</button>
  </div>

  <!-- TAB 1: QUICK ACTION -->
  <div id="tabContentQuick" class="tab-content active">
    <div class="active-tab-box">
      <div id="tabTitle" class="tab-title">Loading active tab...</div>
      <button id="btnDownloadTab" class="btn-main">⚡ Download Current Page / Video</button>
    </div>

    <div class="input-box">
      <input type="text" id="customUrl" placeholder="Paste any download link">
      <button id="btnSendCustom" class="btn-send">Send</button>
    </div>

    <div style="background: #181a20; border: 1px solid #334155; border-radius: 8px; padding: 9px 10px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;">
      <div>
        <div style="font-size: 11px; font-weight: 700; color: #f1f5f9;">⚡ Auto-Intercept Downloads</div>
        <div style="font-size: 10px; color: #94a3b8;">Take over browser downloads (IDM mode)</div>
      </div>
      <label style="position: relative; display: inline-block; width: 34px; height: 18px; cursor: pointer;">
        <input type="checkbox" id="chkAutoIntercept" checked style="opacity: 0; width: 0; height: 0;">
        <span id="sliderSpan" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #2563eb; transition: .3s; border-radius: 18px;"></span>
      </label>
    </div>

    <div style="display: flex; gap: 6px; margin-bottom: 6px;">
      <button id="btnWebRemote" style="flex: 1; background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; cursor: pointer;">🌐 Web Remote</button>
      <button id="btnSetupGuide" style="flex: 1; background: #1e293b; border: 1px solid #334155; color: #38bdf8; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; cursor: pointer;">🧩 Browser Guide</button>
    </div>
  </div>

  <!-- TAB 2: TAB MEDIA INSPECTOR -->
  <div id="tabContentSniff" class="tab-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <span style="font-size: 11px; font-weight: 700; color: #cbd5e1;">Detected Page Media</span>
      <button id="btnDownloadAllSniff" style="background: #10b981; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer;">⚡ Download Filtered</button>
    </div>

    <!-- Category filter buttons for Sniffer -->
    <div style="display: flex; gap: 4px; margin-bottom: 8px; overflow-x: auto; padding-bottom: 2px;">
      <button class="sniff-filter active" data-filter="all">All</button>
      <button class="sniff-filter" data-filter="video">🎬 Videos</button>
      <button class="sniff-filter" data-filter="audio">🎵 Audio</button>
      <button class="sniff-filter" data-filter="image">🖼️ Images</button>
      <button class="sniff-filter" data-filter="file">📦 Files</button>
    </div>

    <div id="snifferContainer" class="sniffer-list">
      <div class="empty-sniffer">Inspecting active tab for media and streams...</div>
    </div>

    <button id="btnRescanTab" style="width: 100%; background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 6px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer;">🔄 Rescan Current Page</button>
  </div>

  <div id="statusMsg" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
